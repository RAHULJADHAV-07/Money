<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: without it the on-screen keyboard overlays the page instead
         of shrinking it, and a bottom-anchored sheet ends up hidden behind the keyboard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f4f6f4" />
    <meta name="description" content="Daily transactions, borrowed & lent, savings and balance in one place." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Hisab" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Inter, variable. If it never arrives (offline, blocked) the system stack
         below it is metric-close enough that nothing reflows badly. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap"
    />

    <title>My Hisab</title>

    <!-- Stamp the theme before first paint, so a dark-mode user never sees a
         white flash while React boots. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('hisab.theme') || 'system';
          if (m !== 'system') document.documentElement.setAttribute('data-theme', m);
          var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#080b0a' : '#f4f6f4');

          /* The chosen accent, stamped before the stylesheet lands — every
             surface is oklch at this hue, so without it the app would paint
             once in the default green and again in whatever was picked. */
          var a = JSON.parse(localStorage.getItem('hisab.appearance.v1') || '{}');
          if (a && isFinite(Number(a.accent))) {
            document.documentElement.style.setProperty('--accent-h', String(Number(a.accent)));
          }
          if (a && a.surface) document.documentElement.setAttribute('data-surface', a.surface);
        } catch (e) { /* private mode — the default light theme is fine */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
