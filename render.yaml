# Render Blueprint — deploys the API. Import this from the Render dashboard,
# or just create a Web Service manually with the same settings.
services:
  - type: web
    name: hisab-api
    runtime: node
    plan: free
    region: singapore              # closest to India; change if you prefer
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false                # Neon pooled connection string — never commit this
      - key: JWT_SECRET
        generateValue: true        # Render generates a strong random secret
      - key: CORS_ORIGINS
        sync: false                # https://your-app.vercel.app
      - key: SELF_URL
        sync: false                # https://hisab-api.onrender.com  (enables keep-alive)
      - key: KEEPALIVE_MINUTES
        value: "10"
